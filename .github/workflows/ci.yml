name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: varyacode_crm_test
          MARIADB_USER: app
          MARIADB_PASSWORD: app
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/varyacode_crm?serverVersion=10.11.0-MariaDB&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: php bin/console lint:container
      - run: php bin/console doctrine:schema:validate --skip-sync
      - name: Les migrations produisent le schéma attendu
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
          php bin/console doctrine:schema:validate --env=test
      - run: php bin/phpunit
